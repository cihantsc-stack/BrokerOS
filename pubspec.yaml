name: mobile
description: "Broker OS mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - images/
    - images/dashboard/
    - assets/world/
    - assets/icons/
    - assets/animations/
    - assets/stock_logos/
    - assets/brand/